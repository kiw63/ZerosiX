name: Build ZerosiX APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build ZerosiX APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          sdkmanager "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Check project
        shell: bash
        run: |
          set -e

          if [ ! -f "settings.gradle.kts" ] && [ ! -f "settings.gradle" ]; then
            echo "::error::settings.gradle.kts tidak ditemukan di root repository."
            exit 1
          fi

          if [ ! -d "app" ]; then
            echo "::error::Folder app tidak ditemukan di root repository."
            exit 1
          fi

          echo "Project ZerosiX ditemukan."
          ls -la

      - name: Build APK
        shell: bash
        run: |
          set -e

          gradle \
            --no-daemon \
            --stacktrace \
            :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "::error::APK tidak ditemukan."
            exit 1
          fi

          echo "APK berhasil dibuat:"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZerosiX-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
